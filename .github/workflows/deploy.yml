name: TennisApp Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "restart-lab: reopen AWS lab session | deploy: force deploy without push | backup-db: dump prod DB | seed-db: populate demo data"
        required: true
        default: restart-lab
        type: choice
        options:
          - restart-lab
          - deploy
          - backup-db
          - seed-db

# ──────────────────────────────────────────────
# PUSH TO MAIN → run tests → build + push ECR + deploy EC2
# ──────────────────────────────────────────────
jobs:
  test:
    name: Run Tests
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tennisapp
          POSTGRES_USER: tennisapp
          POSTGRES_PASSWORD: tennisapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennisapp -d tennisapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: Productos/TennisApp-back
        run: pip install -r requirements.txt

      - name: Run backend tests (pytest)
        working-directory: Productos/TennisApp-back
        env:
          DB_NAME: tennisapp
          DB_USER: tennisapp
          DB_PASSWORD: tennisapp
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Productos/ProyectoTitulo-Front/package-lock.json

      - name: Install frontend dependencies
        working-directory: Productos/ProyectoTitulo-Front
        run: npm ci

      - name: Run frontend tests (vitest)
        working-directory: Productos/ProyectoTitulo-Front
        run: npm run test

  deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'deploy')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get EC2-Back private IP
        id: back-ip
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)
          echo "value=$IP" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: Productos/ProyectoTitulo-Front
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/tennisapp-front:latest
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: Productos/TennisApp-back
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/tennisapp-back:latest
          cache-from: type=gha,scope=back
          cache-to: type=gha,scope=back,mode=max

      - name: Sync docker-compose.yml to EC2
        run: |
          COMPOSE_B64=$(base64 -w 0 Productos/TennisApp-back/docker-compose.yml)
          CMD=$(aws ssm send-command \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $COMPOSE_B64 | base64 -d > /opt/tennisapp/docker-compose.yml\"]" \
            --query "Command.CommandId" --output text)
          for i in $(seq 1 12); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" ]] && break
            sleep 5
          done
          echo "docker-compose.yml sync: $STATUS"

      - name: Deploy backend via SSM
        run: |
          SCRIPT=$(cat << 'EOF'
          #!/bin/bash
          set -e
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ECR_PLACEHOLDER
          export FRONTEND_BASE_URL="http://FRONT_IP_PLACEHOLDER"
          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml pull web
          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml up -d --no-deps web
          echo "Backend updated OK"
          EOF
          )
          SCRIPT="${SCRIPT//ECR_PLACEHOLDER/${{ vars.ECR_REGISTRY }}}"
          SCRIPT="${SCRIPT//FRONT_IP_PLACEHOLDER/${{ vars.FRONT_PUBLIC_IP }}}"
          B64=$(printf '%s' "$SCRIPT" | base64 -w 0)

          CMD=$(aws ssm send-command \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query "Command.CommandId" --output text)

          echo "SSM backend cmd: $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] $STATUS"
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" ]] && break
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
            --query "{Status:Status,Output:StandardOutputContent}" --output table

      - name: Deploy frontend via SSM
        run: |
          BACK_IP="${{ steps.back-ip.outputs.value }}"
          FRONT_IMAGE="${{ vars.ECR_REGISTRY }}/tennisapp-front:latest"
          SCRIPT=$(cat << EOF
          #!/bin/bash
          set -e
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}
          docker pull $FRONT_IMAGE
          docker rm -f tennisapp-front || true
          docker run -d --name tennisapp-front --restart unless-stopped \
            -p 80:80 -e BACKEND_HOST=$BACK_IP $FRONT_IMAGE
          echo "Frontend updated OK"
          EOF
          )
          B64=$(printf '%s' "$SCRIPT" | base64 -w 0)

          CMD=$(aws ssm send-command \
            --instance-ids ${{ vars.FRONT_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query "Command.CommandId" --output text)

          echo "SSM frontend cmd: $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id ${{ vars.FRONT_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] $STATUS"
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" ]] && break
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id ${{ vars.FRONT_INSTANCE_ID }} \
            --query "{Status:Status,Output:StandardOutputContent}" --output table

      - name: App URL
        run: |
          echo "App disponible en: http://${{ vars.FRONT_PUBLIC_IP }}"

  # ──────────────────────────────────────────────
  # BACKUP DB → dump del Postgres de producción (EC2-Back)
  # ──────────────────────────────────────────────
  backup-db:
    name: Backup Production DB
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'backup-db'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Dump production DB via SSM
        run: |
          SCRIPT=$(cat << 'EOF'
          #!/bin/bash
          set -e
          TS=$(date +%Y%m%d_%H%M%S)
          mkdir -p /opt/tennisapp/backups
          FILE="/opt/tennisapp/backups/backup_${TS}.sql"

          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml exec -T db \
            pg_dump -U tennisapp -d tennisapp > "$FILE"

          echo "Backup creado: $FILE"
          ls -lh "$FILE"

          echo "--- Verificación de contenido (conteo de filas por tabla clave) ---"
          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml exec -T db \
            psql -U tennisapp -d tennisapp -c "SELECT relname AS tabla, n_live_tup AS filas FROM pg_stat_user_tables ORDER BY relname;"

          echo "--- Últimos 5 backups conservados ---"
          ls -1t /opt/tennisapp/backups/*.sql | tail -n +6 | xargs -r rm --
          ls -lh /opt/tennisapp/backups/
          EOF
          )
          B64=$(printf '%s' "$SCRIPT" | base64 -w 0)

          CMD=$(aws ssm send-command \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query "Command.CommandId" --output text)

          echo "SSM backup cmd: $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] $STATUS"
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" ]] && break
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output table

  # ──────────────────────────────────────────────
  # SEED DB → puebla datos demo (usuarios + partidos) en el contenedor de produccion
  # ──────────────────────────────────────────────
  seed-db:
    name: Seed Demo Data
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'seed-db'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run seed commands via SSM
        run: |
          SCRIPT=$(cat << 'EOF'
          #!/bin/bash
          echo "=== seed_demo ==="
          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml exec -T web \
            python manage.py seed_demo 2>&1
          echo "exit: $?"
          echo "=== seed_pvp_matches ==="
          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml exec -T web \
            python manage.py seed_pvp_matches 2>&1
          echo "exit: $?"
          echo "=== generate_qr_logins ==="
          /usr/local/bin/docker-compose -f /opt/tennisapp/docker-compose.yml exec -T web \
            python manage.py generate_qr_logins 2>&1
          echo "exit: $?"
          EOF
          )
          B64=$(printf '%s' "$SCRIPT" | base64 -w 0)

          CMD=$(aws ssm send-command \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query "Command.CommandId" --output text)

          echo "SSM seed cmd: $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] $STATUS"
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" ]] && break
            sleep 5
          done
          echo "--- STDOUT ---"
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
            --query "StandardOutputContent" --output text
          echo "--- STDERR ---"
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id ${{ vars.BACK_INSTANCE_ID }} \
            --query "StandardErrorContent" --output text

  # ──────────────────────────────────────────────
  # RESTART LAB → start EC2s + sync IPs
  # ──────────────────────────────────────────────
  restart-lab:
    name: Restart AWS Lab
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'restart-lab'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start instances
        run: |
          aws ec2 start-instances \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} ${{ vars.FRONT_INSTANCE_ID }}
          echo "Iniciando instancias..."

      - name: Wait for instances running
        run: |
          aws ec2 wait instance-running \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} ${{ vars.FRONT_INSTANCE_ID }}
          echo "Instancias running"

      - name: Wait for SSM agents online
        run: |
          for ID in ${{ vars.BACK_INSTANCE_ID }} ${{ vars.FRONT_INSTANCE_ID }}; do
            echo "Esperando SSM en $ID..."
            for i in $(seq 1 30); do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || echo "None")
              echo "  [$i] $STATUS"
              [ "$STATUS" = "Online" ] && break
              sleep 10
            done
          done

      - name: Get new back IP
        id: ips
        run: |
          BACK_PRIVATE=$(aws ec2 describe-instances \
            --instance-ids ${{ vars.BACK_INSTANCE_ID }} \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)

          echo "back_private=$BACK_PRIVATE" >> $GITHUB_OUTPUT
          echo "EC2-Back private IP: $BACK_PRIVATE"
          echo "EC2-Front public IP (Elastic IP, fija): ${{ vars.FRONT_PUBLIC_IP }}"

      - name: Restart frontend with new backend IP
        run: |
          BACK_IP="${{ steps.ips.outputs.back_private }}"
          FRONT_IMAGE="${{ vars.ECR_REGISTRY }}/tennisapp-front:latest"
          SCRIPT=$(cat << EOF
          #!/bin/bash
          set -e
          docker rm -f tennisapp-front || true
          docker run -d --name tennisapp-front --restart unless-stopped \
            -p 80:80 -e BACKEND_HOST=$BACK_IP $FRONT_IMAGE
          echo "Frontend relanzado con BACKEND_HOST=$BACK_IP"
          EOF
          )
          B64=$(printf '%s' "$SCRIPT" | base64 -w 0)

          CMD=$(aws ssm send-command \
            --instance-ids ${{ vars.FRONT_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo $B64 | base64 -d | bash\"]" \
            --query "Command.CommandId" --output text)

          echo "SSM cmd: $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD" --instance-id ${{ vars.FRONT_INSTANCE_ID }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] $STATUS"
            [[ "$STATUS" == "Success" || "$STATUS" == "Failed" ]] && break
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$CMD" --instance-id ${{ vars.FRONT_INSTANCE_ID }} \
            --query "{Status:Status,Output:StandardOutputContent}" --output table

      - name: Lab listo
        run: |
          echo "Lab restaurado."
          echo "App en: http://${{ vars.FRONT_PUBLIC_IP }}"
